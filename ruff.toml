# Black-compatible width, plus pyflakes and bugbear so real errors fail CI rather than style opinions.
line-length = 88

# Examples support Python 3.8+ (examples/first-render/README.md), so rules that
# require newer syntax, like B905 zip(strict=), must not fire.
target-version = "py38"

[lint]
select = ["E", "W", "F", "B"]
