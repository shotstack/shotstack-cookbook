name: check

on:
  pull_request:
  push:
    branches: [master]

jobs:
  format-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - run: npx prettier@3 --check .

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Passes trivially until an example ships Python.
      - run: pip install ruff==0.16.1 && ruff check .

      # Runs the unit tests of each Python example that has a test_*.py file.
      - run: |
          pip install requests==2.34.2
          for dir in $(git ls-files 'examples/*/test_*.py' | xargs -r -n1 dirname | sort -u); do
            python -m unittest discover -s "$dir" -v
          done
